# ====================================================
# VaadVivaad — Common Configuration
# ====================================================
# Profile-specific overrides in application-dev.yml and application-prod.yml
# Activate with: --spring.profiles.active=dev

spring:
  application:
    name: vaadvivaad

  # ---- Database (JPA + Hibernate) ----
  jpa:
    # NEVER use ddl-auto in production. Flyway manages schema.
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # ---- Flyway ----
  flyway:
    enabled: true
    locations: classpath:db/migration

  # ---- Jackson (JSON serialization) ----
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# ---- Server ----
server:
  port: 8080

# ---- Actuator (Health + Info) ----
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always